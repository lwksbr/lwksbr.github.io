<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#321239">
<title>Lightworkers Brahamaputra Trust - Bank Details</title>

<style>
  :root {
    --bg: #321239;
    --cyan: #009acb;
    --green: #98cb65;
    --white: #ffffff;
    --muted: rgba(255,255,255,.72);
    --card: rgba(255,255,255,.075);
    --line: rgba(255,255,255,.14);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 5%, rgba(0,154,203,.16), transparent 34%),
      radial-gradient(circle at 85% 90%, rgba(152,203,101,.12), transparent 32%),
      var(--bg);
    color: var(--white);
    font-family: Inter, Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px;
  }

  .page {
    width: min(100%, 680px);
  }

  /* TOP LOGOS - SAME STYLE AS 1ST CODE */
  .top-logos {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
  }

  .top-logos img {
    height: 80px;
    width: auto;
    object-fit: contain;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: clamp(24px, 5vw, 42px);
    box-shadow: 0 20px 60px rgba(0,0,0,.22);
    backdrop-filter: blur(8px);
  }

  .eyebrow {
    text-align: center;
    color: var(--green);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    margin: 0 0 30px;
    text-align: center;
    font-size: clamp(25px, 6vw, 40px);
    line-height: 1.12;
    letter-spacing: -.5px;
  }

  h1 span {
    background: linear-gradient(90deg, var(--cyan), var(--green));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .details {
    display: grid;
    gap: 14px;
  }

  .detail {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    padding: 17px 18px;
    border-radius: 15px;
    border: 1px solid var(--line);
    background: rgba(0,0,0,.10);
  }

  .label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }

  .value {
    color: var(--white);
    font-size: clamp(15px, 3.9vw, 18px);
    font-weight: 600;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .copy-btn {
    border: 0;
    border-radius: 11px;
    padding: 10px 13px;
    background: linear-gradient(135deg, var(--cyan), var(--green));
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
    transition: transform .15s ease, filter .15s ease;
  }

  .copy-btn:hover {
    filter: brightness(1.08);
  }

  .copy-btn:active {
    transform: scale(.96);
  }

  .copy-btn.copied {
    background: var(--green);
  }

  /* SMALL IDBI LOGO */
  .bank-logo {
    display: block;
    width: 150px;
    height: auto;
    max-height: 45px;
    object-fit: contain;
    margin: 28px auto 4px;
  }

  .footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 18px;
    line-height: 1.5;
  }

  @media (max-width: 480px) {

  body {
    padding: 18px 12px;
  }

  .top-logos {
    gap: 20px;
    margin-bottom: 30px;
  }

  .top-logos img {
    height: 80px;
  }

  .card {
    border-radius: 20px;
    padding: 22px 16px;
  }

  /* Keep text and Copy button on the same row */
  .detail {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
  }

  /* Small Copy button on the right */
  .copy-btn {
    width: auto;
    min-width: 58px;
    padding: 9px 10px;
    font-size: 12px;
  }

  /* Keep IDBI logo small */
  .bank-logo {
    width: 120px;
    max-height: 40px;
    margin-top: 24px;
  }
}
</style>
</head>

<body>

<main class="page">

  <!-- TOP LOGOS -->
  <header class="top-logos" aria-label="Pranic Healing and Lightworkers logos">
    <img src="images/lwks-logo.png" alt="LWKS Logo">
    <img src="images/ph-logo.png" alt="PH Logo">
  </header>

  <section class="card">

    <div class="eyebrow">Bank Transfer Details</div>

    <h1>
      <span>LIGHTWORKERS</span>
      <span>BRAHAMAPUTRA TRUST</span>
    </h1>

    <div class="details">

      <div class="detail">
        <div>
          <div class="label">Name</div>
          <div class="value" id="name">
            LIGHTWORKERS BRAHAMAPUTRA TRUST
          </div>
        </div>
        <button class="copy-btn" onclick="copyValue('name', this)">
          Copy
        </button>
      </div>

      <div class="detail">
        <div>
          <div class="label">Bank &amp; Branch</div>
          <div class="value">
            IDBI BANK, PAN BAZAR, GUWAHATI BRANCH
          </div>
        </div>
      </div>

      <div class="detail">
        <div>
          <div class="label">Account Number</div>
          <div class="value" id="account">
            0115102000026895
          </div>
        </div>
        <button class="copy-btn" onclick="copyValue('account', this)">
          Copy
        </button>
      </div>

      <div class="detail">
        <div>
          <div class="label">IFSC Code</div>
          <div class="value" id="ifsc">
            IBKL0000115
          </div>
        </div>
        <button class="copy-btn" onclick="copyValue('ifsc', this)">
          Copy
        </button>
      </div>

    </div>

    <!-- SMALL IDBI BANK LOGO -->
    <img
      class="bank-logo"
      src="images/IDBI.png"
      alt="IDBI Bank logo"
    >

    <div class="footer">
      Tap "Copy" to copy the required details.<br>
      Please verify the account details before making a transfer.
    </div>

  </section>

</main>

<script>
async function copyValue(id, button) {
  const value = document.getElementById(id).textContent.trim();

  try {
    await navigator.clipboard.writeText(value);
  } catch (e) {
    const area = document.createElement('textarea');
    area.value = value;
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    area.remove();
  }

  const old = button.textContent;

  button.textContent = 'Copied ✓';
  button.classList.add('copied');

  setTimeout(() => {
    button.textContent = old;
    button.classList.remove('copied');
  }, 1400);
}
</script>

</body>
</html>
