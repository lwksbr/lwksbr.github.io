<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="favicon.ico?v=2" type="image/x-icon">

<meta name="theme-color" content="#321239">

<title>UPI Payment | Lightworkers Brahamaputra</title>

<style>
  :root {
    --bg: #321239;
    --cyan: #009acb;
    --green: #98cb65;
    --white: #ffffff;
    --muted: rgba(255,255,255,.72);
    --card: rgba(255,255,255,.075);
    --line: rgba(255,255,255,.14);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;

    background:
      radial-gradient(
        circle at 15% 5%,
        rgba(0,154,203,.16),
        transparent 34%
      ),
      radial-gradient(
        circle at 85% 90%,
        rgba(152,203,101,.12),
        transparent 32%
      ),
      var(--bg);

    color: var(--white);
    font-family: Inter, Arial, Helvetica, sans-serif;

    display: flex;
    justify-content: center;

    padding: 28px 16px;
  }

  .page {
    width: min(100%, 680px);
  }

  /* =========================
     TOP LOGOS
     ========================= */

  .logo-container {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 20px;
    margin: 8px auto 26px;

    padding: 6px 10px;
  }

  .logo-container img {
    height: 80px;
    width: auto;
    object-fit: contain;
  }


  /* =========================
     MAIN CARD
     ========================= */

  .card {
    background: var(--card);

    border: 1px solid var(--line);
    border-radius: 24px;

    padding: clamp(24px, 5vw, 42px);

    box-shadow:
      0 20px 60px rgba(0,0,0,.22);

    backdrop-filter: blur(8px);
  }


  /* =========================
     HEADING
     ========================= */

  .eyebrow {
    text-align: center;

    color: var(--green);

    font-size: 13px;
    font-weight: 700;

    letter-spacing: 2px;
    text-transform: uppercase;

    margin-bottom: 10px;
  }

  h1 {
    margin: 0 0 12px;

    text-align: center;

    font-size: clamp(25px, 6vw, 40px);

    line-height: 1.12;

    letter-spacing: -.5px;
  }

  h1 span {
    background:
      linear-gradient(
        90deg,
        var(--cyan),
        var(--green)
      );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
  }

  .subtitle {
    text-align: center;

    color: var(--muted);

    font-size: 14px;

    margin: 0 0 28px;

    line-height: 1.5;
  }


  /* =========================
     PAY BUTTON
     ========================= */

  .pay-section {
    text-align: center;

    padding: 22px 16px;

    border-radius: 18px;

    border: 1px solid var(--line);

    background: rgba(0,0,0,.10);

    margin-bottom: 24px;
  }

  .pay-button {
    display: inline-block;

    background:
      linear-gradient(
        135deg,
        var(--cyan),
        var(--green)
      );

    color: #ffffff;

    padding: 14px 32px;

    font-size: 17px;

    border: none;
    border-radius: 12px;

    cursor: pointer;

    text-decoration: none;

    font-weight: 800;

    box-shadow:
      0 8px 25px rgba(0,0,0,.18);

    transition:
      transform .15s ease,
      filter .15s ease;
  }

  .pay-button:hover {
    filter: brightness(1.08);
  }

  .pay-button:active {
    transform: scale(.97);
  }

  .mobile-note {
    color: var(--muted);

    font-size: 12px;

    margin: 10px 0 0;
  }


  /* =========================
     QR SECTION
     ========================= */

  .qr-section {
    text-align: center;

    padding: 22px 16px;

    border-radius: 18px;

    border: 1px solid var(--line);

    background: rgba(0,0,0,.10);
  }

  .qr-title {
    color: var(--green);

    font-size: 13px;

    font-weight: 800;

    letter-spacing: 1px;

    margin: 0 0 10px;
  }

/* =========================
   COPY UPI TITLE
   ========================= */

.upi-copy-title {
  color: var(--green);

  font-size: 13px;

  font-weight: 800;

  letter-spacing: 1px;

  text-transform: uppercase;

  margin: 22px auto 13px;

  line-height: 1.5;
}
  /* =========================
     UPI ID + COPY BUTTON
     ========================= */

  .upi-row {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 10px;

    margin: 0 auto 18px;

    max-width: 100%;
  }

  .upi-id {
    color: var(--white);

    font-size: 14px;

    font-weight: 600;

    overflow-wrap: anywhere;

    margin: 0;
  }

  .copy-upi-btn {
    flex-shrink: 0;

    border: 0;

    border-radius: 9px;

    padding: 8px 11px;

    background:
      linear-gradient(
        135deg,
        var(--cyan),
        var(--green)
      );

    color: #ffffff;

    font-size: 12px;

    font-weight: 800;

    cursor: pointer;

    white-space: nowrap;

    transition:
      transform .15s ease,
      filter .15s ease;
  }

  .copy-upi-btn:hover {
    filter: brightness(1.08);
  }

  .copy-upi-btn:active {
    transform: scale(.96);
  }

  .copy-upi-btn.copied {
    background: var(--green);
  }


  /* =========================
     QR CODE
     ========================= */

  .qr-code {
    display: block;

    width: 250px;
    height: 250px;

    max-width: 80vw;

    margin: 0 auto;

    object-fit: contain;

    border-radius: 10px;

    background: #ffffff;

    padding: 8px;
  }


  /* =========================
     UPI + IDBI LOGOS
     ========================= */

  .upi-section {
    text-align: center;

    margin-top: 24px;
  }

  .upi-section > img:first-child {
    width: 180px;

    max-width: 55%;

    height: auto;

    object-fit: contain;
  }

   /* SMALL IDBI LOGO */
  .bank-logo {
    display: block;
    width: 150px;
    height: auto;
    max-height: 45px;
    object-fit: contain;
    margin: 2px auto 4px;
  }
  
  .back-payment-link {
  display: block;
  margin: 8px auto 0;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  text-decoration: none;
}

.back-payment-link:hover {
  color: var(--green);
}


  /* =========================
     CONTACT
     ========================= */

  .contact {
    text-align: center;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.6;

    margin-top: 24px;

    padding-top: 20px;

    border-top: 1px solid var(--line);
  }

  .contact strong {
    color: var(--white);
  }


  /* =========================
     MOBILE
     ========================= */

  @media (max-width: 480px) {

    body {
      padding: 18px 12px;
    }

    .logo-container {
      gap: 20px;

      margin-bottom: 24px;
    }

    .logo-container img {
      height: 80px;
    }

    .card {
      border-radius: 20px;

      padding: 22px 16px;
    }

    h1 {
      font-size: 27px;
    }

    .pay-button {
      padding: 13px 25px;

      font-size: 16px;
    }

    /* UPI ID + Copy button stay on same row */
    .upi-row {
      justify-content: center;

      gap: 8px;

      align-items: center;
    }

    .upi-id {
      font-size: 13px;
    }

    .copy-upi-btn {
      padding: 8px 10px;

      font-size: 11px;
    }

    .qr-code {
      width: 220px;
      height: 220px;
    }

    .upi-section > img:first-child {
      width: 150px;
    }

    /* Keep IDBI logo small */
  .bank-logo {
    width: 120px;
    max-height: 40px;
    margin-top: 24px;
  }

    .contact {
      font-size: 12px;
    }
  }
</style>
</head>


<body>

<div class="qr-section">

<script>

/* =========================
   COPY UPI ID
   ========================= */

async function copyUPI(button) {

  const value =
    document.getElementById("upiId")
    .textContent
    .trim();

  try {

    await navigator.clipboard.writeText(value);

  } catch (e) {

    const area =
      document.createElement("textarea");

    area.value = value;

    document.body.appendChild(area);

    area.select();

    document.execCommand("copy");

    area.remove();
  }

  const oldText = button.textContent;

  button.textContent = "Copied ✓";

  button.classList.add("copied");

  setTimeout(() => {

    button.textContent = oldText;

    button.classList.remove("copied");

  }, 1400);
}

</script>

</html>
